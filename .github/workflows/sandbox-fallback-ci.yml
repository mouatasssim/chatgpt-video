name: Sandbox fallback CI

on:
  push:
    branches:
      - agent/chatgpt-sandbox-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q skills/watch/scripts tests

      - name: Run critical sandbox regression checks
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          scripts = Path('skills/watch/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import download

          # Missing yt-dlp must not abort a URL run.
          original_cmd = download._yt_dlp_command
          original_public = download._fetch_public_youtube_transcript
          download._yt_dlp_command = lambda: None
          download._fetch_public_youtube_transcript = lambda _url, _out: None
          try:
              with tempfile.TemporaryDirectory() as td:
                  result = download.download_url(
                      'https://www.youtube.com/watch?v=BLR6S4Dfcmg',
                      Path(td),
                  )
              assert result['video_path'] is None
              assert result['downloaded'] is False
              assert result['remote_video_unavailable'] is True
          finally:
              download._yt_dlp_command = original_cmd
              download._fetch_public_youtube_transcript = original_public

          # Public transcript payload must convert to valid VTT.
          with tempfile.TemporaryDirectory() as td:
              target = Path(td) / 'fallback.vtt'
              duration = download._write_public_transcript_vtt([
                  {'text': 'hello', 'start': 0.5, 'duration': 1.25},
                  {'text': 'world', 'start': 2.0, 'duration': 0.5},
              ], target)
              text = target.read_text(encoding='utf-8')
              assert text.startswith('WEBVTT')
              assert '00:00:00.500 --> 00:00:01.750' in text
              assert duration == 2.5

          print('critical sandbox regression checks: PASS')
          PY

      - name: Smoke-test requested YouTube video without yt-dlp
        shell: bash
        env:
          WATCH_PUBLIC_TRANSCRIPT_FALLBACK: 'true'
        run: |
          mkdir -p smoke
          set +e
          python skills/watch/scripts/watch.py \
            'https://youtu.be/BLR6S4Dfcmg?si=vqlg5irqzSr1uR4q' \
            --detail transcript \
            --no-whisper \
            --out-dir "$PWD/smoke/work" \
            > smoke/report.txt \
            2> smoke/stderr.txt
          code=$?
          echo "$code" > smoke/exit-code.txt
          echo '===== watch stderr ====='
          cat smoke/stderr.txt || true
          echo '===== watch report ====='
          cat smoke/report.txt || true
          echo "watch exit code: $code"
          exit 0

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-video-smoke
          path: smoke/
          if-no-files-found: warn
