name: Sandbox fallback CI

on:
  push:
    branches:
      - agent/chatgpt-sandbox-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp and standalone FFmpeg
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q yt-dlp
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -L --fail --retry 2 \
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz' \
            -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Run /watch at 30 seconds
        shell: bash
        env:
          WATCH_PUBLIC_TRANSCRIPT_FALLBACK: 'true'
        run: |
          export PATH="$RUNNER_TEMP/ffmpeg/bin:$PATH"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          mkdir -p smoke
          set +e
          python skills/watch/scripts/watch.py \
            'https://youtu.be/dQw4w9WgXcQ' \
            --detail transcript \
            --timestamps '0:30' \
            --no-whisper \
            --out-dir "$PWD/smoke/work" \
            > smoke/report.txt \
            2> smoke/stderr.txt
          code=$?
          echo "$code" > smoke/exit-code.txt
          echo '===== stderr ====='
          cat smoke/stderr.txt || true
          echo '===== report ====='
          cat smoke/report.txt || true
          echo "watch exit code: $code"
          exit 0

      - name: Upload /watch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-30s-test
          path: smoke/
          if-no-files-found: warn
