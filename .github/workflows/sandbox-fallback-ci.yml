name: Sandbox fallback CI

on:
  push:
    branches:
      - agent/chatgpt-sandbox-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q skills/watch/scripts tests

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Test sandbox downloader fallbacks
        run: pytest -q tests/test_download.py
