name: Sandbox fallback CI

on:
  push:
    branches:
      - agent/chatgpt-sandbox-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m yt_dlp --version
          ffmpeg -version | head -n 1

      - name: Run /watch at 30 seconds
        shell: bash
        env:
          WATCH_PUBLIC_TRANSCRIPT_FALLBACK: 'true'
        run: |
          mkdir -p smoke
          set +e
          python skills/watch/scripts/watch.py \
            'https://youtu.be/dQw4w9WgXcQ' \
            --detail transcript \
            --timestamps '0:30' \
            --no-whisper \
            --out-dir "$PWD/smoke/work" \
            > smoke/report.txt \
            2> smoke/stderr.txt
          code=$?
          echo "$code" > smoke/exit-code.txt
          echo '===== stderr ====='
          cat smoke/stderr.txt || true
          echo '===== report ====='
          cat smoke/report.txt || true
          echo "watch exit code: $code"
          exit 0

      - name: Upload /watch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-30s-test
          path: smoke/
          if-no-files-found: warn
